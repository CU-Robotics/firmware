# Jetson build sandbox (Ubuntu 24.04, arm64), runnable from any machine.
#
#   docker compose run --rm install   # run tools/install_compiler.sh
#   docker compose run --rm build     # build the firmware
#   docker compose down -v            # wipe the volume, back to a fresh Jetson
#
x-sandbox: &sandbox
  platform: linux/arm64
  build:
    context: .
    dockerfile: Dockerfile
  image: cu-robotics/firmware-jetson:latest
  volumes:
    - .:/repo:ro
    - work:/workspace
  working_dir: /workspace

services:
  install:
    <<: *sandbox
    command: >
      bash -eo pipefail -c '
        sync-repo;
        echo "=== tools/install_compiler.sh ===";
        bash tools/install_compiler.sh;
        echo "=== installed ===";
        ./tools/compiler/arm-gnu-toolchain/bin/arm-none-eabi-g++ --version | head -1
      '

  build:
    <<: *sandbox
    command: >
      bash -eo pipefail -c '
        sync-repo;
        make build
      '

  shell:
    <<: *sandbox
    stdin_open: true
    tty: true
    command: bash

volumes:
  work:
