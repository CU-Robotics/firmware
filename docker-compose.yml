# Jetson build sandbox (Ubuntu 24.04, arm64). Verifies that the compiler
# install script and a full firmware build work on a Jetson, from any machine.
#
#   docker compose run --rm install   # run tools/install_compiler.sh
#   docker compose run --rm build     # build the firmware
#   docker compose down -v            # wipe it all, back to a fresh Jetson
#
# Your checkout is mounted read-only at /repo and synced into a named volume at
# /workspace, where the install and build actually happen. That matters:
# install_compiler.sh starts with `rm -rf ./tools/compiler`, and it installs
# Linux binaries -- neither belongs anywhere near your host working tree.
x-sandbox: &sandbox
  build:
    context: .
    dockerfile: Dockerfile
  image: cu-robotics/firmware-jetson:latest
  volumes:
    - .:/repo:ro
    - work:/workspace
  working_dir: /workspace

services:
  # Installs the arm-none-eabi toolchain into the volume's tools/compiler by
  # running the real script. Note this is install_compiler.sh directly, not
  # `make install` -- the latter also installs tytools, which this image has no
  # use for since it never flashes hardware.
  install:
    <<: *sandbox
    command: >
      bash -eo pipefail -c '
        sync-repo;
        echo "=== tools/install_compiler.sh ===";
        bash tools/install_compiler.sh;
        echo "=== installed ===";
        ./tools/compiler/arm-gnu-toolchain/bin/arm-none-eabi-g++ --version | head -1
      '

  # Builds the firmware with whatever `install` put in tools/compiler. Job count
  # is left to the Makefile, and success is make's exit code -- so this stays
  # correct regardless of where the Makefile puts its artifacts.
  build:
    <<: *sandbox
    command: >
      bash -eo pipefail -c '
        sync-repo;
        make build
      '

  # Interactive shell in the sandbox, for poking around.
  shell:
    <<: *sandbox
    stdin_open: true
    tty: true
    command: bash

volumes:
  work:
